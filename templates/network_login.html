<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Countdown Clock Setup</title>
        <style>
            body {font-family: Arial, sans-serif; margin: 50px; background-color: #f4f4f9;}
            .container {max-width: 400px; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);}
            select, input[type="password"], button {width: 100%; padding: 10px; margin-top: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;}
            button {background-color: #007BFF; color: white; border: none; font-size: 16px; cursor: pointer;}
            button:hover {background-color: #0056B3;}
            .message {color: green; margin-bottom: 15px;}
        </style>
    </head>
    <body>
        <div class="container">
            <h2>Connect to Wi-Fi</h2>
            {% if status %}
                <div class="message">{{status}}</div>
            {% endif %}
            <form method="POST" action="/">
                <label for="wifi_ssid">Select Wi-Fi Network:</label>
                <select name="wifi_ssid" id="wifi_ssid" required>
                    <option value="" disabled selected>--- Choose Network ---</option>
                    {% for net in networks %}
                        <option value="{{net}}">{{net}}</option>
                    {% endfor %}
                </select>
                <label for="wifi_password">Password:</label>
                <input type="password" name="wifi_password" id="wifi_password" placeholder="Enter Wi-Fi Password" required>
                <button type="submit">Connect</button>
            </form>
        </div>
    </body>
</html>
